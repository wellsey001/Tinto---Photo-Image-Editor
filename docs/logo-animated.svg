<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Tinto">
  <title>Tinto</title>
  <!-- The splash-screen animation on a loop: the slider knob glides left and back,
       the filled track follows it, and the eye watches it and blinks. -->
  <style>
    .logo { transform-origin: 80px 76px; animation: pop .55s cubic-bezier(.3, 1.6, .5, 1) .1s both; }
    .t-knob, .t-fill, .t-eye, .t-pupil { transform-box: view-box; }
    .t-fill { transform-origin: 16px 41.5px; animation: t-fill 1.6s cubic-bezier(.45, 0, .25, 1) .7s infinite; }
    .t-knob { animation: t-slide 1.6s cubic-bezier(.45, 0, .25, 1) .7s infinite; }
    .t-pupil { animation: t-look 1.6s ease-in-out .7s infinite; }
    .t-eye { transform-origin: 42px 25px; animation: t-blink 1.6s ease-in-out .7s infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(.45) rotate(-14deg); } 100% { opacity: 1; transform: none; } }
    @keyframes t-slide { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-44px); } }
    @keyframes t-fill { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.154); } }
    @keyframes t-look { 0%, 100% { transform: translateX(0); } 30%, 65% { transform: translateX(-2.4px); } }
    @keyframes t-blink { 0%, 9%, 21%, 100% { transform: scaleY(1); } 15% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#efb34a" flood-opacity=".35"/>
    </filter>
  </defs>
  <g class="logo">
    <rect x="16" y="12" width="128" height="128" rx="30" fill="#efb34a" filter="url(#shadow)"/>
    <svg x="27.5" y="23.5" width="105" height="105" viewBox="0 0 100 100">
      <rect x="16" y="37" width="68" height="9" rx="4.5" fill="#121316" opacity=".28"/>
      <path d="M42 16 V66 Q42 80 56 80 H62" fill="none" stroke="#121316" stroke-width="13" stroke-linecap="round"/>
      <rect class="t-fill" x="16" y="37" width="52" height="9" rx="4.5" fill="#121316"/>
      <g class="t-eye">
        <circle cx="42" cy="25" r="4.6" fill="#ffffff"/>
        <circle class="t-pupil" cx="43.2" cy="25" r="2.1" fill="#121316"/>
      </g>
      <circle class="t-knob" cx="68" cy="41.5" r="11.5" fill="#ffffff" stroke="#121316" stroke-width="5.5"/>
    </svg>
  </g>
</svg>
