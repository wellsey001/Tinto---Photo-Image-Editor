# Builds Tinto on GitHub's own computers: a Windows installer (.exe) and a Linux AppImage.
# - Every push to main and every pull request: both are kept as downloadable build artifacts.
# - A version tag like v1.2.0 (or publishing a release with that tag): both, and their update
#   files, are attached to the release. Installed copies of Tinto read latest.yml (Windows) and
#   latest-linux.yml (Linux) to find updates.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $want"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Check the app includes the updater and the AI runtime
        shell: bash
        run: |
          npx @electron/asar list dist/win-unpacked/resources/app.asar > asar.txt
          grep -qE "node_modules[\\\\/]electron-updater[\\\\/]package.json" asar.txt
          grep -qE "node_modules[\\\\/]@huggingface[\\\\/]transformers[\\\\/]package.json" asar.txt
          ls dist/win-unpacked/resources/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v*/win32/x64/
          du -h dist/*.exe

      - name: Run the background remover inside the packaged app
        shell: bash
        run: |
          TINTO_SELFTEST=cutout TINTO_SELFTEST_OUT="$PWD/selftest.json" timeout 300 dist/win-unpacked/Tinto.exe || true
          cat selftest.json
          grep -q '"ok":true' selftest.json

      - name: Check the "Updating" splash window (shown while the installer runs)
        shell: powershell
        run: |
          $ps1 = Join-Path $PWD 'src\update-splash.ps1'; $gif = Join-Path $PWD 'src\assets\updating.gif'
          $p = Start-Process powershell.exe -PassThru -RedirectStandardError err.txt -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-STA','-File',"`"$ps1`"",'-Gif',"`"$gif`"",'-OldPid','0','-ExeName','NoSuchApp','-TimeoutSec','8'
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          try {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap 420, 300
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen([int]($b.Width / 2 - 210), [int]($b.Height / 2 - 150), 0, 0, $bmp.Size)
            $yellow = 0
            for ($x = 0; $x -lt 420; $x += 3) { for ($y = 0; $y -lt 300; $y += 3) { $c = $bmp.GetPixel($x, $y); if ($c.R -gt 200 -and $c.G -gt 140 -and $c.B -lt 120) { $yellow++ } } }
            Write-Host "Logo-yellow pixels in the middle of the screen: $yellow"
            if ($yellow -lt 150) { Write-Host "::warning::The updating splash wasn't seen on screen (the build machine may have no visible desktop)." }
          } catch { Write-Host "::warning::Couldn't capture the screen: $_" }
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw 'The updating splash did not close by itself.' }
          $err = Get-Content err.txt -Raw
          if ($err) { Write-Host $err; throw 'The updating splash script reported errors.' }
          Write-Host "Updating splash closed by itself (exit code $($p.ExitCode))."

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: Tinto-Windows
          path: |
            dist/*.exe
            dist/latest.yml

      - name: Attach installer and update files to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $want"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run the background remover once (downloads the AI model)
        run: node scripts/check-cutout.js

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Check the app includes the updater and the AI runtime
        run: |
          npx @electron/asar list dist/linux-unpacked/resources/app.asar > asar.txt
          grep -qE "node_modules[\\\\/]electron-updater[\\\\/]package.json" asar.txt
          grep -qE "node_modules[\\\\/]@huggingface[\\\\/]transformers[\\\\/]package.json" asar.txt
          ls dist/linux-unpacked/resources/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v*/linux/x64/
          du -h dist/*.AppImage

      - name: Run the background remover inside the packaged app
        run: |
          TINTO_SELFTEST=cutout TINTO_SELFTEST_OUT="$PWD/selftest.json" timeout 300 xvfb-run -a dist/linux-unpacked/tinto --no-sandbox || true
          cat selftest.json
          grep -q '"ok":true' selftest.json

      - name: Upload AppImage
        uses: actions/upload-artifact@v5
        with:
          name: Tinto-Linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml

      - name: Attach AppImage and update files to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/latest-linux.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $want"
            exit 1
          fi

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Create the Android project from the editor
        working-directory: mobile
        run: |
          rm -rf www android
          cp -r ../src/renderer www
          # the AI tools run in the page on Android: ship transformers.js and onnxruntime's WebAssembly with the app
          mkdir -p www/vendor/transformers
          T=node_modules/@huggingface/transformers/dist
          ls $T
          if [ -f $T/transformers.web.min.js ]; then cp $T/transformers.web.min.js www/vendor/transformers/transformers.min.js; else cp $T/transformers.min.js www/vendor/transformers/transformers.min.js; fi
          cp $T/*.wasm $T/ort*.mjs www/vendor/transformers/ 2>/dev/null || true
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded*.wasm node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded*.mjs www/vendor/transformers/ 2>/dev/null || true
          ls -la www/vendor/transformers
          # and they need WebAssembly, the model downloads and the update check, which the desktop page doesn't
          sed -i "s#script-src 'self'#script-src 'self' 'wasm-unsafe-eval'#; s#connect-src 'self' blob: data:#connect-src 'self' blob: data: https:#" www/index.html
          grep -o "Content-Security-Policy[^>]*" www/index.html
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#efb34a' --iconBackgroundColorDark '#efb34a' --splashBackgroundColor '#121316' --splashBackgroundColorDark '#121316'
          npx cap sync android

      - name: Check the AI tools work inside the page
        run: |
          (cd mobile && npm install --no-save --no-audit --no-fund puppeteer-core@23)
          node scripts/check-web-ai.mjs "$(which google-chrome || which chromium)"

      - name: Set the version, permissions and file types
        working-directory: mobile/android
        run: |
          VER=$(node -p "require('../../package.json').version")
          CODE=$(node -p "const [a,b,c]=require('../../package.json').version.split('.').map(Number); a*10000+b*100+c")
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" app/build.gradle
          # older Android (9 and below) needs permission to save into Pictures and Documents
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />#' app/src/main/AndroidManifest.xml
          grep -n "versionCode\|versionName" app/build.gradle
          grep -n "permission" app/src/main/AndroidManifest.xml

      - name: Build the APK
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          VER=$(node -p "require('../../package.json').version")
          mkdir -p ../../dist
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew --no-daemon assembleRelease
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_B64" | base64 -d > tinto.keystore
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks tinto.keystore --ks-key-alias tinto --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "../../dist/Tinto-$VER.apk" aligned.apk
            "$BT/apksigner" verify --print-certs "../../dist/Tinto-$VER.apk" | head -3
            rm -f tinto.keystore
          else
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets before publishing an Android release."
              exit 1
            fi
            echo "::warning::No signing key set up yet, so this is a test build signed with a temporary key."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../../dist/Tinto-$VER-test.apk"
          fi
          du -h ../../dist/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Tinto-Android
          path: dist/*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
