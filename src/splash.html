<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Tinto</title>
<style>
  /* The loading screen: the logo pops in, the slider knob glides left and back while the
     eye watches it and blinks, and the name slides up. The whole animation lasts 1.8 seconds;
     the editor opens when it's done (or when it's ready, if that takes longer, with the logo
     gently breathing meanwhile). */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-app-region: drag; }
  body { display: grid; place-items: center; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .card {
    position: relative; width: 420px; height: 300px; border-radius: 26px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #2a2216 0%, #16161a 58%, #121316 100%);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .07) inset;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    animation: card-in .35s ease-out both;
  }
  .glow {
    position: absolute; width: 260px; height: 260px; left: 50%; top: 42%; translate: -50% -50%;
    background: radial-gradient(circle, rgba(239, 179, 74, .42), rgba(239, 179, 74, 0) 65%);
    filter: blur(6px); opacity: 0; animation: glow 1.8s ease-out .15s both;
  }
  .logo { position: relative; width: 128px; height: 128px; animation: pop .55s cubic-bezier(.3, 1.6, .5, 1) .1s both; }
  .tile { width: 100%; height: 100%; border-radius: 30px; background: #efb34a; display: grid; place-items: center; box-shadow: 0 12px 26px rgba(239, 179, 74, .35); }
  .tile svg { width: 82%; height: 82%; display: block; }
  .t-knob, .t-fill, .t-eye, .t-pupil { transform-box: view-box; }
  .t-fill { transform-origin: 16px 41.5px; animation: t-fill .95s cubic-bezier(.45, 0, .25, 1) .6s both; }
  .t-knob { animation: t-slide .95s cubic-bezier(.45, 0, .25, 1) .6s both; }
  .t-pupil { animation: t-look .95s ease-in-out .6s both; }
  .t-eye { transform-origin: 42px 25px; animation: t-blink .22s ease-in-out .8s both; }
  .name {
    position: relative; font-size: 34px; font-weight: 800; letter-spacing: .5px; line-height: 1.1;
    background: linear-gradient(105deg, #f6c46a 0%, #ffd98f 30%, #fff3d6 45%, #ffffff 50%, #fff3d6 55%, #ffd98f 70%, #efb34a 100%);
    background-size: 300% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rise .5s cubic-bezier(.2, .9, .3, 1) .85s both, shine .75s cubic-bezier(.45, .05, .25, 1) 1.02s both;
  }
  .sub { position: relative; margin-top: -6px; font-size: 13px; letter-spacing: .4px; color: #8f929a; animation: rise .5s cubic-bezier(.2, .9, .3, 1) 1s both; }
  .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: linear-gradient(90deg, #d9962e, #efb34a, #ffd98f); transform-origin: left; animation: load 1.8s cubic-bezier(.4, .1, .3, 1) both; }
  /* Still loading after the animation: the logo breathes until the editor is ready. */
  body.waiting .logo { animation: breathe 1.4s ease-in-out infinite; }
  body.leaving .card { animation: card-out .18s ease-in both; }

  @keyframes card-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes card-out { to { opacity: 0; transform: scale(1.02); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.45) rotate(-14deg); } 100% { opacity: 1; transform: none; } }
  @keyframes glow { 0% { opacity: 0; transform: scale(.6); } 45% { opacity: 1; } 100% { opacity: .55; transform: scale(1); } }
  /* The knob glides to the left end of the slider and back; the filled part of the track follows it. */
  @keyframes t-slide { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-44px); } }
  @keyframes t-fill { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.154); } }
  /* The eye looks after the knob, and blinks as it passes underneath. */
  @keyframes t-look { 0%, 100% { transform: translateX(0); } 30%, 65% { transform: translateX(-2.4px); } }
  @keyframes t-blink { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: 0% 0; } }
  @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
  <div class="card" role="img" aria-label="Tinto is starting">
    <div class="glow"></div>
    <div class="logo">
      <div class="tile">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect x="16" y="37" width="68" height="9" rx="4.5" fill="#121316" opacity=".28"/>
          <path d="M42 16 V66 Q42 80 56 80 H62" fill="none" stroke="#121316" stroke-width="13" stroke-linecap="round"/>
          <rect class="t-fill" x="16" y="37" width="52" height="9" rx="4.5" fill="#121316"/>
          <g class="t-eye">
            <circle cx="42" cy="25" r="4.6" fill="#ffffff"/>
            <circle class="t-pupil" cx="43.2" cy="25" r="2.1" fill="#121316"/>
          </g>
          <circle class="t-knob" cx="68" cy="41.5" r="11.5" fill="#ffffff" stroke="#121316" stroke-width="5.5"/>
        </svg>
      </div>
    </div>
    <div class="name">Tinto</div>
    <div class="sub">Photo &amp; Image Editor</div>
    <div class="bar"></div>
  </div>
  <script>
    // After the animation, keep breathing until the editor shows (the main process closes this window).
    setTimeout(() => document.body.classList.add('waiting'), 1900);
  </script>
</body>
</html>
